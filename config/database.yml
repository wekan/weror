# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
# The databases are stored in `./db/#{Rails.env}/`, the paths Litestack used
# before it was replaced with the sqlite3 adapter of Rails, so existing data
# stays where it is. LITESTACK_DATA_PATH still moves that root directory, for
# example onto a persistent volume in production.
#
<% data_root = ENV.fetch("LITESTACK_DATA_PATH", "db") %>
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= File.join(data_root, "development", "data.sqlite3") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= File.join(data_root, "test", "data.sqlite3") %>

# Warning: Make sure your production database path is on a persistent
# volume, otherwise your application data could be deleted between deploys.
# Cache and Action Cable use their own databases beside it (Solid Cache and
# Solid Cable, in place of Litecache and Litecable).
production:
  primary:
    <<: *default
    database: <%= File.join(data_root, "production", "data.sqlite3") %>
  cache:
    <<: *default
    database: <%= File.join(data_root, "production", "cache.sqlite3") %>
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    database: <%= File.join(data_root, "production", "cable.sqlite3") %>
    migrations_paths: db/cable_migrate
